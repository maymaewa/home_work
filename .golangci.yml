version: "2"

run:
  tests: true

  build-tags:
    - bench
    - !bench

linters:
  default: none

  settings:
    revive:
      rules:
        - name: blank-imports
          disabled: true

    funlen:
      lines: 150
      statements: 80

    depguard:
      rules:
        Main:
          files:
            - $all
            - "!$test"
          allow:
            - $gostd
            - golang.org/x/example/hello/reverse
            - github.com/json-iterator/go

        Test:
          files:
            - $test
          allow:
            - $gostd
            - github.com/stretchr/testify

  enable:
    - asciicheck
    - dogsled
    - dupl
    - bodyclose
    - durationcheck
    - errorlint
    - exhaustive
    - copyloopvar
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goheader
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - lll
    - makezero
    - misspell
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - tagliatelle
    - thelper
    - unconvert
    - unparam
    - unused
    - whitespace

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - dupl
          - gocyclo
          - gosec

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt