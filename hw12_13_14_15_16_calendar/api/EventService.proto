syntax = "proto3";

package event;

option go_package = "github.com/maymaewa/home_work/hw12_13_14_15_calendar/internal/server/grpc/event";

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service EventService {
    rpc CreateEvent(CreateEventRequest) returns (Event);
    rpc UpdateEvent(UpdateEventRequest) returns (Event);
    rpc DeleteEvent(DeleteEventRequest) returns (google.protobuf.Empty);

    rpc ListEventsForDay(ListEventsRequest) returns (ListEventsResponse);
    rpc ListEventsForWeek(ListEventsRequest) returns (ListEventsResponse);
    rpc ListEventsForMonth(ListEventsRequest) returns (ListEventsResponse);
}

message Event {
    string id = 1;
    string title = 2;
    google.protobuf.Timestamp start_at = 3;
    google.protobuf.Timestamp end_at = 4;
    string description = 5;
    string user_id = 6;
    google.protobuf.Duration notify_before = 7;
}

message CreateEventRequest {
    Event event = 1;
}

message UpdateEventRequest {
    string id = 1;
    Event event = 2;
}

message DeleteEventRequest {
    string id = 1;
}

message ListEventsRequest {
    google.protobuf.Timestamp date = 1;
    string user_id = 2;
}

message ListEventsResponse {
    repeated Event events = 1;
}