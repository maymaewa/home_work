services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  migrations:
    image: golang:1.25
    working_dir: /app
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        go install github.com/pressly/goose/v3/cmd/goose@v3.24.3
        /go/bin/goose -dir ./migrations postgres "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable" up

  calendar:
    build:
      context: ..
      dockerfile: build/Dockerfile.calendar
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  calendar_scheduler:
    build:
      context: ..
      dockerfile: build/Dockerfile.scheduler.integration
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  calendar_sender:
    build:
      context: ..
      dockerfile: build/Dockerfile.sender
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  integration-tests:
    build:
      context: ..
      dockerfile: build/Dockerfile.integration
    depends_on:
      calendar:
        condition: service_started
      calendar_scheduler:
        condition: service_started
      calendar_sender:
        condition: service_started
    environment:
      CALENDAR_URL: http://calendar:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: rabbit
      RABBITMQ_PASSWORD: password
      RABBITMQ_STATUS_QUEUE: calendar.notification.status