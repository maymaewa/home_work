services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  migrations:
    image: golang:1.25
    working_dir: /app
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        go install github.com/pressly/goose/v3/cmd/goose@v3.24.3
        /go/bin/goose -dir ./migrations postgres "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable" up

  calendar:
    build:
      context: ..
      dockerfile: build/Dockerfile.calendar
    ports:
      - "8888:8080"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  calendar_scheduler:
    build:
      context: ..
      dockerfile: build/Dockerfile.scheduler
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  calendar_sender:
    build:
      context: ..
      dockerfile: build/Dockerfile.sender
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data: